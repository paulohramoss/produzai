<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- PWA primary -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#F97316">

    <!-- Fundo do app pintado antes do CSS do bundle chegar. Sem isto, todo F5
         pisca branco antes da tela aparecer — o que já parece "saí do app". -->
    <style>html,body{margin:0;background:#0C0C0C;color-scheme:dark}</style>

    <!-- PWA standalone behavior -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rise Plan">

    <!-- SEO / sharing -->
    <!-- A descrição vende o resultado, não o módulo: é ela que aparece no
         Google e na prévia do WhatsApp, onde ninguém sabe o que é "template". -->
    <meta name="description" content="Seu histórico de treino vira decisão: qual carga puxar hoje, o que comprar no mercado e quando descansar. Grátis.">
    <meta name="application-name" content="The Rise Plan">
    <link rel="canonical" href="__SITE_URL__/">

    <title>The Rise Plan — pare de treinar no escuro</title>

    <!-- Open Graph: sem isto o link compartilhado chega sem prévia nenhuma. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="The Rise Plan">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="__SITE_URL__/">
    <meta property="og:title" content="Pare de treinar no escuro">
    <meta property="og:description" content="Seu histórico de treino vira decisão: qual carga puxar hoje, o que comprar no mercado e quando descansar.">
    <meta property="og:image" content="__SITE_URL__/og-cover.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Rise Plan — treino, dieta e cabeça no mesmo lugar">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Pare de treinar no escuro">
    <meta name="twitter:description" content="Seu histórico de treino vira decisão: qual carga puxar hoje, o que comprar no mercado e quando descansar.">
    <meta name="twitter:image" content="__SITE_URL__/og-cover.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62.5..125,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
